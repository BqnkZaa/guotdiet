version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # - DATABASE_URL=postgresql://user:pass@db:5432/mydb?schema=public
      # - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      # - db
      pass
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Uncomment if you want to run your own postgres instance instead of Supabase
  # db:
  #   image: postgres:15-alpine
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=user
  #     - POSTGRES_PASSWORD=pass
  #     - POSTGRES_DB=mydb
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: always

# volumes:
#   postgres_data:
